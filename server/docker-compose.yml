version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: team_user
      POSTGRES_PASSWORD: team_password
      POSTGRES_DB: teamformation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
